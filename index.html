<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Animación´-CSS</title>
    <style>

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background: url('fondo2.jpeg') no-repeat center center;
            background-size: cover;
            background-color: #0b0d17;
            perspective: 1000px; 
        }
         .linterna {
            position: absolute;
            bottom: -100px;
            width: 60px;
            height: 85px;
            background: url('linterna2.png') no-repeat center center;
            background-size: contain;
            filter: var(--brillo-linterna);
            animation: festival var(--tiempo-vuelo) linear infinite;
            opacity: 0;
        }

        
        @keyframes festival {
            0% {
                transform: translate3d(0, 0, 0);
                opacity: 0;
            }
            10% { opacity: 1; }
            
            80% {
                opacity: 1;
              
            }
            100% {
                
                transform: translate3d(var(--mover-x), -110vh, -400px);
                opacity: 0;
            }
        }
        
        
    </style>
</head>
<body>

    <main class="escena">
        <div class="linterna izq t1"></div>
        <div class="linterna izq-lejos t3"></div>
        <div class="linterna izq t5"></div>

        <div class="linterna der t2"></div>
        <div class="linterna der-lejos t4"></div>
        <div class="linterna der t1"></div>
        
        </main>

</body>
</html>
